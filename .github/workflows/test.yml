# Her PR'da: amber testi yeşil mi, sabotaj yakalanıyor mu, kurulum dosyaları (public/r) kaynakla aynı mı.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run sabotage
      - name: Kurulum dosyaları güncel mi
        run: |
          npm run build
          git diff --exit-code -- registry.json AI/katalog.md public/r || { echo "public/r ya da katalog eski: npm run build çalıştırıp commit et"; exit 1; }
